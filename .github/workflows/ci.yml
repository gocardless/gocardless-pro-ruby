name: CI
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - master

env:
  RUBYGEM_PUBLISH_API_KEY: ${{ secrets.RUBYGEM_PUBLISH_API_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        faraday-version:
          - '2.0'
        ruby-version:
          - '3.3'
          - '3.4'
          - '4.0'
    env:
      FARADAY_VERSION: ${{ matrix.faraday-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle install && bundle exec rspec

  all-tests-passed:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check test job status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job did not succeed"
            exit 1
          fi

  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Check if version is already released
        id: version_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(ruby -r ./lib/gocardless_pro/version.rb -e 'puts GoCardlessPro::VERSION')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi
      - name: Build and publish gem
        if: steps.version_check.outputs.already_published == 'false'
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:rubygems_api_key: $RUBYGEM_PUBLISH_API_KEY\n" > $HOME/.gem/credentials
          gem build *.gemspec
          gem push *.gem
      - name: Create GitHub Release
        if: steps.version_check.outputs.already_published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version_check.outputs.version }}
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes
